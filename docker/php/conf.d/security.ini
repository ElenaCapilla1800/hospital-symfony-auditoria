; Endurecimiento de PHP
; Se carga al final (prefijo zz-) para que prevalezca sobre otros .ini.

; Mitigación de CVE-2026-115560 (RCE vía "session upload progress", sin parche a 23/10/2026).
; La app no usa barras de progreso de subida, así que desactivarlo no tiene impacto funcional.
session.upload_progress.enabled = 0

; No anunciar la versión de PHP en la cabecera X-Powered-By.
expose_php = Off
